    <main class="flex-grow-1">
        <div class="container-lg py-4">
        <section id="google_map" class="mt-1">
            <div class="card-header bg-dark text-white">
                <h2>Example of an embedded object: Google Maps</h2>
            </div>
            <div class="card-body">
                <p> Please click the buttons below to show the birthplace
                    of a famous scientist.
                </p>
                <select class="form-select w-100 w-md-auto my-3" onchange="showMap(this.value)">
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d70729764.69688149!2d1.7664749664146886!3d34.261489944230824!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788099438129!5m2!1sen!2suk">Choose a Scientist</option>
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d110992.45598462927!2d9.974808485619452!3d48.39155497974015!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788098262794!5m2!1sen!2suk">
                        Albert Einstein (Ulm, Germany)
                    </option>
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3477612.3363203914!2d18.570628799678044!3d52.14373894639115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788098549578!5m2!1sen!2suk">
                        Marie Curie (Warsaw, Poland)
                    </option>
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1758277.1790262277!2d-1.8261603861552738!3d51.64335350212816!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788099101100!5m2!1sen!2suk">
                        Stephen Hawking (Oxford, England)
                    </option>
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d465160.45752881584!2d-74.20008782854666!3d40.65028678923747!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788099259471!5m2!1sen!2suk">
                        Richard Feynman (Queens, New York, USA)
                    </option>
                    <option value="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d20130.749480397935!2d68.56784947982334!3d58.30832230157981!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788099349936!5m2!1sen!2suk">
                        Dmitri Mendeleev (Verkhnie Aremzyani, Siberia, Russia)
                    </option>
                </select>

                <div class="ratio ratio-16x9">
                    <iframe id="mapFrame"
                            style="border:0"
                            loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"
                            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d70729764.69688149!2d1.7664749664146886!3d34.261489944230824!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2suk!4v1788099438129!5m2!1sen!2suk">
